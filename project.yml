name: GeminiVPN
options:
  bundleIdPrefix: com.geminivpn
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_BITCODE: NO
  SWIFT_STRICT_CONCURRENCY: complete

targets:
  GeminiVPN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GeminiVPN
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.geminivpn.app
      INFOPLIST_FILE: GeminiVPN/Info.plist
      CODE_SIGN_ENTITLEMENTS: GeminiVPN/GeminiVPN.entitlements
      TARGETED_DEVICE_FAMILY: "1" # iPhone
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      DEVELOPMENT_TEAM: "" # Set your Apple Developer Team ID here

    dependencies:
      - target: PacketTunnel
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.geminivpn.app.tunnel
      INFOPLIST_FILE: PacketTunnel/Info.plist
      CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
      DEVELOPMENT_TEAM: "" # Set your Apple Developer Team ID here
      SKIP_INSTALL: YES
