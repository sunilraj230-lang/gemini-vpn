name: Build iOS VPN App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure Project for CI
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM: ""/DEVELOPMENT_TEAM: ""\n      CODE_SIGN_STYLE: Manual/g' project.yml || true

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Fix Xcode Project Format Compatibility
        run: |
          python3 -c "
          import re
          path = 'GeminiVPN.xcodeproj/project.pbxproj'
          with open(path, 'r') as f: content = f.read()
          content = re.sub(r'objectVersion = \d+;', 'objectVersion = 56;', content)
          with open(path, 'w') as f: f.write(content)
          print('Successfully patched project format objectVersion to 56!')
          "

      - name: Build Main App & Network Extension
        run: |
          xcodebuild -project GeminiVPN.xcodeproj \
            -scheme GeminiVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "GeminiVPN.app" -type d | head -n 1)
          echo "Packaging application found at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r GeminiVPN-unsigned.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiVPN-iOS-App
          path: GeminiVPN-unsigned.ipa
          retention-days: 14
