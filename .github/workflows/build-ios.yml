name: Build iOS VPN App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply Compatibility Patches
        run: |
          python3 << 'EOF'
          import os

          def patch_content(path, transforms):
              if not os.path.exists(path):
                  print(f"Skipping missing file: {path}")
                  return
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              for old, new in transforms:
                  if old in content:
                      content = content.replace(old, new)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"Successfully processed {path}")

          # 1. Fix PacketTunnelProvider imports and Sendable conformance
          patch_content('PacketTunnel/PacketTunnelProvider.swift', [
              ('import os.log', 'import OSLog'),
              ('class PacketTunnelProvider: NEPacketTunnelProvider {', 'class PacketTunnelProvider: NEPacketTunnelProvider, @unchecked Sendable {')
          ])

          # 2. Fix SharedStorage Sendable
          patch_content('Shared/SharedStorage.swift', [
              ('class SharedStorage {', 'class SharedStorage: @unchecked Sendable {')
          ])

          # 3. Fix AmneziaWGObfuscator Sendable
          patch_content('PacketTunnel/AmneziaWGObfuscator.swift', [
              ('class AmneziaWGObfuscator {', 'class AmneziaWGObfuscator: @unchecked Sendable {')
          ])

          # 4. Fix Services Sendable
          patch_content('GeminiVPN/Services/DynamicNodePoolService.swift', [
              ('class DynamicNodePoolService {', 'class DynamicNodePoolService: @unchecked Sendable {')
          ])
          patch_content('GeminiVPN/Services/ConfigImportService.swift', [
              ('class ConfigImportService {', 'class ConfigImportService: @unchecked Sendable {')
          ])

          # 5. Fix project.yml concurrency settings and code signing
          patch_content('project.yml', [
              ('SWIFT_STRICT_CONCURRENCY: complete', 'SWIFT_STRICT_CONCURRENCY: minimal\n  SWIFT_TREAT_WARNINGS_AS_ERRORS: NO'),
              ('DEVELOPMENT_TEAM: ""', 'DEVELOPMENT_TEAM: ""\n      CODE_SIGN_STYLE: Manual')
          ])

          print("All Swift and project configuration patches applied successfully!")
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Fix Xcode Project Format Compatibility
        run: |
          python3 << 'EOF'
          import re
          path = 'GeminiVPN.xcodeproj/project.pbxproj'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'objectVersion = \d+;', 'objectVersion = 56;', content)
          with open(path, 'w') as f:
              f.write(content)
          print("Patched project format objectVersion to 56 for Xcode compatibility")
          EOF

      - name: Build Main App & Network Extension
        run: |
          set -o pipefail
          xcodebuild -project GeminiVPN.xcodeproj \
            -scheme GeminiVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee xcodebuild.log || (echo "### Build Failed:" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "GeminiVPN.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "GeminiVPN.app" -type d | head -n 1)
          fi
          echo "Packaging application found at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r GeminiVPN-unsigned.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiVPN-iOS-App
          path: GeminiVPN-unsigned.ipa
          retention-days: 14
