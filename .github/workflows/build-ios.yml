name: Build iOS VPN App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Configure SDK Signing Permissions
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Configuring SDK at: $SDK_PATH"
          sudo plutil -replace DefaultProperties.AD_HOC_CODE_SIGNING_ALLOWED -string YES "$SDK_PATH/SDKSettings.plist" || true
          sudo plutil -replace DefaultProperties.CODE_SIGNING_REQUIRED -string NO "$SDK_PATH/SDKSettings.plist" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply Compatibility Patches
        run: |
          python3 << 'EOF'
          import os

          def patch_content(path, transforms):
              if not os.path.exists(path):
                  print(f"Skipping missing file: {path}")
                  return
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              for old, new in transforms:
                  if old in content:
                      content = content.replace(old, new)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"Successfully processed {path}")

          # 1. Fix PacketTunnelProvider imports, Sendable, NWEndpoint, and closures
          if os.path.exists('PacketTunnel/PacketTunnelProvider.swift'):
              with open('PacketTunnel/PacketTunnelProvider.swift', 'r', encoding='utf-8') as f:
                  p = f.read()
              p = p.replace('import os.log', 'import OSLog')
              if 'typealias NWEndpoint' not in p:
                  p = p.replace('import OSLog', 'import OSLog\n\ntypealias NWEndpoint = Network.NWEndpoint')
              p = p.replace('class PacketTunnelProvider: NEPacketTunnelProvider {', 'class PacketTunnelProvider: NEPacketTunnelProvider, @unchecked Sendable {')
              p = p.replace('let port = NWEndpoint.Port(rawValue: portInt)', 'let port = Network.NWEndpoint.Port(rawValue: portInt)')
              p = p.replace('let host = NWEndpoint.Host(String(parts[0]))', 'let host = Network.NWEndpoint.Host(String(parts[0]))')
              p = p.replace('private func setupOutboundConnection(host: NWEndpoint.Host, port: NWEndpoint.Port)', 'private func setupOutboundConnection(host: Network.NWEndpoint.Host, port: Network.NWEndpoint.Port)')
              p = p.replace('conn.stateUpdateHandler = { [weak self] state in', 'conn.stateUpdateHandler = { [weak self] (state: NWConnection.State) in')
              p = p.replace('conn.start(queue: .global(qos: .userInitiated))', 'conn.start(queue: DispatchQueue.global(qos: .userInitiated))')
              with open('PacketTunnel/PacketTunnelProvider.swift', 'w', encoding='utf-8') as f:
                  f.write(p)
              print("Patched PacketTunnelProvider.swift successfully")

          # 2. Fix VPNManager MainActor and formatSpeed
          if os.path.exists('GeminiVPN/Services/VPNManager.swift'):
              with open('GeminiVPN/Services/VPNManager.swift', 'r', encoding='utf-8') as f:
                  v = f.read()
              v = v.replace('private func formatSpeed(bytes: UInt64) -> String {', 'nonisolated private func formatSpeed(bytes: UInt64) -> String {')
              
              old_timer = '''        timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in
            guard let self = self else { return }'''
              new_timer = '''        timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in
            Task { @MainActor [weak self] in
                guard let self = self else { return }'''
              if old_timer in v:
                  v = v.replace(old_timer, new_timer)
                  v = v.replace('            self.lastBytesOut = bytesOut\n        }', '            self.lastBytesOut = bytesOut\n            }\n        }')
              
              with open('GeminiVPN/Services/VPNManager.swift', 'w', encoding='utf-8') as f:
                  f.write(v)
              print("Patched VPNManager.swift successfully")

          # 3. Fix SharedStorage Sendable
          patch_content('Shared/SharedStorage.swift', [
              ('class SharedStorage {', 'class SharedStorage: @unchecked Sendable {')
          ])

          # 4. Fix AmneziaWGObfuscator Sendable
          patch_content('PacketTunnel/AmneziaWGObfuscator.swift', [
              ('class AmneziaWGObfuscator {', 'class AmneziaWGObfuscator: @unchecked Sendable {')
          ])

          # 5. Fix Services Sendable
          patch_content('GeminiVPN/Services/DynamicNodePoolService.swift', [
              ('class DynamicNodePoolService {', 'class DynamicNodePoolService: @unchecked Sendable {')
          ])
          patch_content('GeminiVPN/Services/ConfigImportService.swift', [
              ('class ConfigImportService {', 'class ConfigImportService: @unchecked Sendable {')
          ])

          # 6. Fix project.yml concurrency settings and code signing
          patch_content('project.yml', [
              ('SWIFT_STRICT_CONCURRENCY: complete', 'SWIFT_STRICT_CONCURRENCY: minimal\n  SWIFT_TREAT_WARNINGS_AS_ERRORS: NO'),
              ('CODE_SIGNING_ALLOWED: YES', 'CODE_SIGNING_ALLOWED: NO'),
              ('CODE_SIGN_IDENTITY: "-"', 'CODE_SIGN_IDENTITY: ""'),
              ('DEVELOPMENT_TEAM: ""', 'DEVELOPMENT_TEAM: ""\n      CODE_SIGN_STYLE: Manual')
          ])

          print("All Swift and project configuration patches applied successfully!")
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Fix Xcode Project Format Compatibility
        run: |
          python3 << 'EOF'
          import re
          path = 'GeminiVPN.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'objectVersion = \d+;', 'objectVersion = 56;', content)
          with open(path, 'w') as f:
              f.write(content)
          print("Patched project format objectVersion to 56 for Xcode compatibility")
          EOF

      - name: Build Main App & Network Extension
        run: |
          set -o pipefail
          xcodebuild -project GeminiVPN.xcodeproj \
            -scheme GeminiVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            clean build 2>&1 | tee xcodebuild.log || (echo "### Build Failed:" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "GeminiVPN.app" -type d | head -n 1)
          echo "Packaging application found at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r GeminiVPN-unsigned.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiVPN-iOS-App
          path: GeminiVPN-unsigned.ipa
          retention-days: 14
