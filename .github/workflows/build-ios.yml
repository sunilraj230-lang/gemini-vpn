name: Build iOS VPN App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Network Extension
        run: |
          xcodebuild -project GeminiVPN.xcodeproj \
            -scheme GeminiVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "GeminiVPN.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r GeminiVPN-unsigned.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiVPN-iOS-App
          path: GeminiVPN-unsigned.ipa
          retention-days: 14
