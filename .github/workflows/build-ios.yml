name: Build iOS VPN App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Configure SDK Signing Permissions
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Configuring SDK at: $SDK_PATH"
          sudo plutil -replace DefaultProperties.AD_HOC_CODE_SIGNING_ALLOWED -string YES "$SDK_PATH/SDKSettings.plist" || true
          sudo plutil -replace DefaultProperties.CODE_SIGNING_REQUIRED -string NO "$SDK_PATH/SDKSettings.plist" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply Compatibility Patches
        run: |
          python3 -c "
          with open('PacketTunnel/PacketTunnelProvider.swift', 'r', encoding='utf-8') as f: c = f.read()
          c = c.replace('import os.log', 'import OSLog\ntypealias NWEndpoint = Network.NWEndpoint')
          if 'typealias NWEndpoint' not in c: c = c.replace('import OSLog', 'import OSLog\ntypealias NWEndpoint = Network.NWEndpoint')
          c = c.replace('class PacketTunnelProvider: NEPacketTunnelProvider {', 'class PacketTunnelProvider: NEPacketTunnelProvider, @unchecked Sendable {')
          c = c.replace('let port = NWEndpoint.Port(rawValue: portInt)', 'let port = Network.NWEndpoint.Port(rawValue: portInt)')
          c = c.replace('let host = NWEndpoint.Host(String(parts[0]))', 'let host = Network.NWEndpoint.Host(String(parts[0]))')
          c = c.replace('private func setupOutboundConnection(host: NWEndpoint.Host, port: NWEndpoint.Port)', 'private func setupOutboundConnection(host: Network.NWEndpoint.Host, port: Network.NWEndpoint.Port)')
          c = c.replace('conn.stateUpdateHandler = { [weak self] state in', 'conn.stateUpdateHandler = { [weak self] (state: NWConnection.State) in')
          c = c.replace('conn.start(queue: .global(qos: .userInitiated))', 'conn.start(queue: DispatchQueue.global(qos: .userInitiated))')
          with open('PacketTunnel/PacketTunnelProvider.swift', 'w', encoding='utf-8') as f: f.write(c)

          with open('GeminiVPN/Services/VPNManager.swift', 'r', encoding='utf-8') as f: v = f.read()
